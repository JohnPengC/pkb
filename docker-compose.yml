services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pkb-postgres
    environment:
      POSTGRES_DB: pkb
      POSTGRES_USER: pkb
      POSTGRES_PASSWORD: pkb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
