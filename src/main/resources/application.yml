server:
  port: 8080

spring:
  application:
    name: pkb
  datasource:
    url: jdbc:postgresql://localhost:5432/pkb
    username: pkb
    password: pkb
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: pkb-knowledge
        version: 0.1.0
        instructions: "个人知识库：检索与读取已确认的知识文档"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

pkb:
  storage-path: ${PKB_STORAGE_PATH:./storage}
  converter:
    enabled: ${MARKITDOWN_ENABLED:true}
    command: ${MARKITDOWN_COMMAND:markitdown}
    timeout-seconds: ${MARKITDOWN_TIMEOUT_SECONDS:120}
  render:
    # SPA 页面正文为空时的无头浏览器兜底（容器内置 Chromium 默认开；本地无浏览器默认关）
    enabled: ${PKB_JS_RENDER:false}
  model:
    chat:
      base-url: ${CHAT_BASE_URL:https://api.moonshot.cn/v1}
      api-key: ${CHAT_API_KEY:changeme}
      model: ${CHAT_MODEL:moonshot-v1-8k}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://api.moonshot.cn/v1}
      api-key: ${EMBEDDING_API_KEY:changeme}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      dimension: 1024
